# Issue/PR agent: mention @claude in an issue, issue comment or PR review (as the repo owner)
# and it works on a claude/* branch. Changes reach main only through a PR that passes CI.
name: Claude

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Public repo: only the owner can start a run, so others can't spend the token.
    if: >-
      (github.event_name == 'issues' &&
       github.event.issue.author_association == 'OWNER' &&
       (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))) ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.author_association == 'OWNER' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.comment.author_association == 'OWNER' &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.author_association == 'OWNER' &&
       contains(github.event.review.body, '@claude'))
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # CI's verify job also fails any PR that touches mpn.data.ts or the checksum test.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Bash(pnpm type-check),Bash(pnpm lint),Bash(pnpm test),Bash(pnpm build),Bash(pnpm install --ignore-scripts:*),Bash(pnpm exec commitlint:*)"
            --disallowedTools "Edit(mpn.data.ts),Write(mpn.data.ts),Edit(test/table-checksum.test.ts),Write(test/table-checksum.test.ts),Edit(.github/**),Write(.github/**)"
