# Stages a release on npm when a GitHub release is published. Uses npm trusted publishing (OIDC),
# so there is no npm token. Nothing goes live until the owner approves the staged version on
# npmjs.com with 2FA (`npm stage approve`). The "npm" environment only accepts v* tags.
name: Publish

on:
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # `npm stage publish` needs npm >= 11.15.0; Node 24's bundled npm may be older
      - name: Install npm
        run: npm install -g npm@11.21.2

      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version (expected v$version)"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # Includes test/table-checksum.test.ts, which fails if any MPN table value changes
      - run: pnpm test

      - run: pnpm build

      # Pre-releases go to the "next" dist-tag so `npm install mpn-lookup` keeps the stable version
      - name: Stage for publishing
        run: npm stage publish --access public --provenance --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
