name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets agent workflows re-run CI after pushing (pushes with GITHUB_TOKEN don't trigger runs)
  workflow_dispatch:

# Job names are required status checks on main; renaming one needs a ruleset update.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Includes test/table-checksum.test.ts, which fails if any MPN table value changes
      - run: pnpm test
      - run: pnpm build
      - name: Check package contents
        run: npm pack --dry-run

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The MPN tables are constant (CLAUDE.md). Fails any change to them or to the checksum
      # test that guards them, whoever (or whatever agent) made it.
      - name: Protected files unchanged
        run: |
          changed=$(git diff --name-only origin/main...HEAD -- mpn.data.ts test/table-checksum.test.ts)
          if [ -n "$changed" ]; then
            echo "::error::Protected files changed: $changed"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm type-check
      - name: Lint
        run: pnpm lint
      # The commit-msg rules only run locally; make sure commitlint still accepts valid
      # messages and rejects invalid ones after dependency updates.
      - name: Commitlint smoke test
        run: |
          echo "ci: smoke test" | pnpm exec commitlint
          if echo "not a conventional commit" | pnpm exec commitlint; then
            echo "::error::commitlint accepted an invalid message"
            exit 1
          fi
